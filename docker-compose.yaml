# Values come from .env in this directory when it exists (Compose reads it for interpolation).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: staff-pulse-server
    environment:
      PORT: "3001"
      MOCK_SCENARIO: ${MOCK_SCENARIO:-}
      PATCH_INTERVAL_MS: ${PATCH_INTERVAL_MS:-2000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        BUILD_VERSION: ${BUILD_VERSION:-docker}
    container_name: staff-pulse-client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
